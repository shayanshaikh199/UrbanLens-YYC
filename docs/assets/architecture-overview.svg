<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">UrbanLens-YYC Architecture Overview</title>
  <desc id="desc">A visual overview of the React Three.js frontend, FastAPI backend, SQLite persistence, Groq LLM integration, and Calgary open-data feeds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#11110f"/>
      <stop offset="1" stop-color="#263633"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d8c798"/>
    </marker>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#fffaf0;font-weight:800}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#c8d6d1;font-size:18px;font-weight:600}
      .tiny{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9fb0aa;font-size:15px;font-weight:600}
      .box{fill:#181714;stroke:#d8c798;stroke-width:2;rx:18;filter:url(#shadow)}
      .soft{fill:#24322f;stroke:#7ca69c;stroke-width:2;rx:18;filter:url(#shadow)}
      .data{fill:#111b1a;stroke:#8bb8d8;stroke-width:2;rx:18;filter:url(#shadow)}
      .line{stroke:#d8c798;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="620" fill="url(#bg)"/>
  <text x="56" y="70" class="label" font-size="34">UrbanLens-YYC System Architecture</text>
  <text x="56" y="102" class="small">Full-stack 3D city dashboard for Downtown Core / Stephen Ave, Calgary</text>

  <rect class="box" x="70" y="170" width="250" height="160"/>
  <text x="100" y="218" class="label" font-size="25">React Frontend</text>
  <text x="100" y="255" class="small">Three.js city scene</text>
  <text x="100" y="284" class="small">LLM query dock</text>
  <text x="100" y="313" class="small">Map tools + saved views</text>

  <rect class="soft" x="435" y="170" width="250" height="160"/>
  <text x="465" y="218" class="label" font-size="25">FastAPI Backend</text>
  <text x="465" y="255" class="small">Map data APIs</text>
  <text x="465" y="284" class="small">Query interpreter</text>
  <text x="465" y="313" class="small">Project persistence</text>

  <rect class="data" x="800" y="130" width="250" height="100"/>
  <text x="830" y="172" class="label" font-size="23">Calgary Open Data</text>
  <text x="830" y="204" class="tiny">Buildings, assessments, permits</text>

  <rect class="data" x="800" y="275" width="250" height="100"/>
  <text x="830" y="317" class="label" font-size="23">Groq LLM</text>
  <text x="830" y="349" class="tiny">Natural-language filters</text>

  <rect class="data" x="435" y="430" width="250" height="100"/>
  <text x="465" y="472" class="label" font-size="23">SQLite</text>
  <text x="465" y="504" class="tiny">Username project saves</text>

  <path class="line" d="M320 250 C360 250, 395 250, 435 250"/>
  <path class="line" d="M685 220 C725 200, 760 185, 800 180"/>
  <path class="line" d="M685 280 C725 300, 760 315, 800 325"/>
  <path class="line" d="M560 330 L560 430"/>
  <path class="line" d="M435 300 C385 365, 330 425, 270 475"/>

  <rect x="70" y="410" width="250" height="120" rx="16" fill="#111b1a" stroke="#d8c798" stroke-width="1.5"/>
  <text x="100" y="453" class="label" font-size="22">3D Layers</text>
  <text x="100" y="484" class="tiny">Buildings, permits, roads, bus stops</text>
  <text x="100" y="510" class="tiny">Sun / shadow study</text>
</svg>
