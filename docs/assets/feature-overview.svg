<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">UrbanLens-YYC Feature Overview</title>
  <desc id="desc">A feature board showing the main UrbanLens-YYC capabilities.</desc>
  <rect width="1120" height="620" fill="#fbfaf6"/>
  <style>
    .h{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#151512;font-weight:850}
    .p{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#4b5551;font-size:18px;font-weight:600}
    .card{fill:#ffffff;stroke:#d8d1c1;stroke-width:2;rx:14}
    .chip{fill:#151512;rx:20}
    .chipText{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#fffaf0;font-size:14px;font-weight:800}
  </style>
  <text x="58" y="72" class="h" font-size="36">UrbanLens-YYC Submission Highlights</text>
  <text x="58" y="108" class="p">A compact, full-stack urban design dashboard built for the MASIV Fall 2026 intern test.</text>

  <g transform="translate(58 160)">
    <rect class="card" width="310" height="155"/>
    <circle cx="55" cy="55" r="24" fill="#d8c798"/>
    <text x="95" y="52" class="h" font-size="23">3D Calgary Blocks</text>
    <text x="30" y="98" class="p">Extruded building footprints with height, zoning, use, and value details.</text>
  </g>
  <g transform="translate(405 160)">
    <rect class="card" width="310" height="155"/>
    <circle cx="55" cy="55" r="24" fill="#3aa7e0"/>
    <text x="95" y="52" class="h" font-size="23">Civic Data Layers</text>
    <text x="30" y="98" class="p">Permit pins, road centerlines, and bus-stop markers for context.</text>
  </g>
  <g transform="translate(752 160)">
    <rect class="card" width="310" height="155"/>
    <circle cx="55" cy="55" r="24" fill="#c778ee"/>
    <text x="95" y="52" class="h" font-size="23">LLM Filtering</text>
    <text x="30" y="98" class="p">Natural-language prompts turn into validated building filters.</text>
  </g>

  <g transform="translate(58 360)">
    <rect class="card" width="310" height="155"/>
    <circle cx="55" cy="55" r="24" fill="#7ca69c"/>
    <text x="95" y="52" class="h" font-size="23">Saved Analyses</text>
    <text x="30" y="98" class="p">Username-based project saves, loads, and deletes backed by SQLite.</text>
  </g>
  <g transform="translate(405 360)">
    <rect class="card" width="310" height="155"/>
    <circle cx="55" cy="55" r="24" fill="#f0c75f"/>
    <text x="95" y="52" class="h" font-size="23">Sun + Shadows</text>
    <text x="30" y="98" class="p">24-hour lighting slider with day, sunset, night, and shadows.</text>
  </g>
  <g transform="translate(752 360)">
    <rect class="card" width="310" height="155"/>
    <circle cx="55" cy="55" r="24" fill="#111512"/>
    <text x="95" y="52" class="h" font-size="23">Submission Ready</text>
    <text x="30" y="98" class="p">README, UML, demo script, deployment checklist, and tests.</text>
  </g>

  <rect class="chip" x="58" y="555" width="170" height="38"/>
  <text class="chipText" x="82" y="579">FastAPI</text>
  <rect class="chip" x="244" y="555" width="170" height="38"/>
  <text class="chipText" x="278" y="579">React</text>
  <rect class="chip" x="430" y="555" width="170" height="38"/>
  <text class="chipText" x="461" y="579">Three.js</text>
  <rect class="chip" x="616" y="555" width="170" height="38"/>
  <text class="chipText" x="660" y="579">Groq</text>
  <rect class="chip" x="802" y="555" width="170" height="38"/>
  <text class="chipText" x="842" y="579">SQLite</text>
</svg>
